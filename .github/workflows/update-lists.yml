name: update-lists
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch lists and generate registry
        run: |
          MIRROR="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python3 netadblock_lists.py --config config.json --registry assets.json fetch --out public
          python3 netadblock_lists.py --config config.json --registry assets.json registry --out public --mirror "$MIRROR"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update lists $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
