name: update-lists
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch lists and generate registry
        run: |
          MIRROR="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          python3 netadblock_lists.py --config config.json --registry assets.json fetch --out site
          python3 netadblock_lists.py --config config.json --registry assets.json registry --out site --mirror "$MIRROR"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
